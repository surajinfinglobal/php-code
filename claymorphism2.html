<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Aura - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --clay-bg: #f0f4f8;
            --clay-primary: #ecb2ff;
            --clay-primary-dark: #d490e6;
            --clay-shadow-outer: rgba(163, 177, 198, 0.6);
            --clay-shadow-inner: rgba(255, 255, 255, 0.8);
            --clay-inset-shadow: rgba(163, 177, 198, 0.5);
        }

        body {
            background-color: #e6eef4;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a5568;
        }

        /* Claymorphism Main Container */
        .clay-card {
            background: var(--clay-bg);
            border-radius: 3rem;
            box-shadow: 
                20px 20px 60px var(--clay-shadow-outer),
                -20px -20px 60px var(--clay-shadow-inner),
                inset 10px 10px 20px rgba(255, 255, 255, 0.5),
                inset -10px -10px 20px rgba(163, 177, 198, 0.2);
            position: relative;
        }

        /* Recessed Input Fields */
        .clay-input-well {
            background: var(--clay-bg);
            box-shadow: 
                inset 6px 6px 12px var(--clay-inset-shadow),
                inset -6px -6px 12px var(--clay-shadow-inner);
            border: none;
            transition: all 0.3s ease;
        }
        
        .clay-input-well:focus-within {
            box-shadow: 
                inset 8px 8px 16px var(--clay-inset-shadow),
                inset -8px -8px 16px var(--clay-shadow-inner);
        }

        /* Inflated Clay Buttons */
        .clay-button-primary {
            background: #bd00ff;
            color: white;
            box-shadow: 
                8px 8px 16px rgba(189, 0, 255, 0.3),
                -4px -4px 12px rgba(255, 255, 255, 0.8),
                inset 4px 4px 8px rgba(255, 255, 255, 0.4),
                inset -4px -4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .clay-button-primary:active {
            transform: scale(0.96);
            box-shadow: 
                4px 4px 8px rgba(189, 0, 255, 0.2),
                inset 6px 6px 12px rgba(0, 0, 0, 0.1);
        }

        .clay-button-secondary {
            background: var(--clay-bg);
            box-shadow: 
                8px 8px 16px var(--clay-shadow-outer),
                -8px -8px 16px var(--clay-shadow-inner),
                inset 4px 4px 8px rgba(255, 255, 255, 0.6),
                inset -4px -4px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .clay-button-secondary:active {
            transform: scale(0.98);
            box-shadow: 
                inset 4px 4px 8px var(--clay-inset-shadow);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#bd00ff",
                        "background": "#e6eef4",
                        "surface": "#f0f4f8",
                        "on-surface": "#2d3748",
                        "on-surface-muted": "#718096"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "2xl": "4rem"
                    },
                    fontFamily: {
                        "headline-md": ["Outfit"],
                        "body-md": ["Outfit"],
                        "label-md": ["Outfit"]
                    },
                    fontSize: {
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }

         function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";

      if (isPassword) {
        // Eye open icon
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
          </svg>
        `;
        btn.title = "Hide Password";
      } else {
        // Eye closed icon
        btn.innerHTML = `
          <svg stroke="#bd00ff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        `;
        btn.title = "Show Password";
      }
    }
    
    </script>
</head>
<body class="bg-background p-safe-margin">
<!-- Screen Container -->
<main class="w-full max-w-md mx-auto py-12 flex flex-col items-center">
<!-- Branding Header -->
<header class="mb-12 text-center">
<h1 class="font-headline-md text-headline-md text-primary tracking-widest uppercase mb-2">AURA</h1>
<p class="font-body-md text-on-surface-muted">Begin your journey into the void.</p>
</header>
<!-- Signup Panel -->
<section class="clay-card w-full p-10 flex flex-col gap-8">
<h2 class="font-headline-md text-headline-md text-on-surface text-center">Create Account</h2>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-muted px-4">Full Name</label>
<div class="clay-input-well h-14 rounded-2xl flex items-center px-5 gap-3">
<span class="material-symbols-outlined text-on-surface-muted">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-gray-400 font-body-md" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-muted px-4">Email Address</label>
<div class="clay-input-well h-14 rounded-2xl flex items-center px-5 gap-3">
<span class="material-symbols-outlined text-on-surface-muted">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-gray-400 font-body-md" placeholder="name@aura.io" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-muted px-4">Password</label>
<div class="clay-input-well h-14 rounded-2xl flex items-center px-5 gap-3">
<span class="material-symbols-outlined text-on-surface-muted">lock</span>
<input type="password" id="reg-pass" class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-gray-400 font-body-md" placeholder="••••••••" type="password"/>
 <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('reg-pass', this)" title="Show Password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
</div>
</div>
<!-- Sign Up Button -->
<button   class="clay-button-primary btn h-14 rounded-full mt-4 font-label-md text-lg flex items-center justify-center gap-2" >
                    Sign Up
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[2px] flex-grow bg-gray-200 rounded-full"></div>
<span class="font-label-md text-gray-400 text-xs">OR CONTINUE WITH</span>
<div class="h-[2px] flex-grow bg-gray-200 rounded-full"></div>
</div>
<!-- Social Login -->
<button class="clay-button-secondary h-14 rounded-full flex items-center justify-center gap-3 w-full font-label-md text-on-surface">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2kJSlvIxTvsA7gWIOOub948fzv9GW39yxnSq7l0MNCuNmkJZEsJ07cG68gr1dNvxuSPU_dsCme9D4Jt3Wdkj5J1n3JSd-EcnEdbMHtADxU8R_tj8zVNTGAs6z3qBnwyV17p5ZcuXRl5f3JktluFoepkKVorjjIW2GTed9ryrEgmjJ_iRUtWpLMFdVkXQ0uXJ2wTcOkYnfpLR4FcUBZ1gtHlxWBdJrDRWBnog7EqqwuSxnxziPCkL32cI25z93Gb5PvkRRXDG9z8pR"/>
                Google
            </button>
<!-- Footer Link -->
<footer class="text-center">
<p class="font-body-md text-on-surface-muted">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Log in</a>
</p>
</footer>
</section>
<!-- Terms -->
<p class="mt-12 text-center text-gray-400 text-xs px-10 leading-relaxed">
            By signing up, you agree to our <b>Terms of Service</b> and <b>Privacy Policy</b>. Your data is encrypted and secure.
        </p>
</main>
</body></html>
