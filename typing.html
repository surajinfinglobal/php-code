
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc;
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        .timer-circle {
            width: 120px;
            height: 120px;
            border: 10px solid #eab308;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 700;
            color: #1f2937;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .typing-box {
            background: white;
            border: 3px solid #eab308;
            border-radius: 24px;
            min-height: 220px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .text-display {
            font-size: 1.55rem;
            line-height: 2.4rem;
            font-family: 'Inter', sans-serif;
        }
        .cursor {
            display: inline-block;
            width: 4px;
            height: 32px;
            background: #eab308;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen py-12 px-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-semibold text-gray-800 text-center mb-10">TYPING SPEED TEST</h1>

        <h2 class="text-6xl font-bold title-font text-center text-gray-900 mb-12 tracking-tight">
            Test your typing skills
        </h2>

        <!-- Timer & Stats -->
        <div class="flex flex-col md:flex-row items-center justify-center gap-12 mb-12">
            <div class="flex flex-col items-center">
                <div id="timerCircle" class="timer-circle">60</div>
                <p class="text-sm text-gray-500 mt-3">seconds</p>
            </div>

            <div class="grid grid-cols-3 gap-6">
                <div class="stat-card p-6 text-center w-32">
                    <div id="wpm" class="text-4xl font-bold text-gray-800">0</div>
                    <div class="text-xs text-gray-500">WORDS/MIN</div>
                </div>
                <div class="stat-card p-6 text-center w-32">
                    <div id="cpm" class="text-4xl font-bold text-gray-800">0</div>
                    <div class="text-xs text-gray-500">CHARS/MIN</div>
                </div>
                <div class="stat-card p-6 text-center w-32">
                    <div id="accuracy" class="text-4xl font-bold text-gray-800">100%</div>
                    <div class="text-xs text-gray-500">% ACCURACY</div>
                </div>
            </div>
        </div>

        <!-- Start Button -->
        <div id="startContainer" class="flex justify-center mb-10">
            <button onclick="startGame()" 
                    class="bg-yellow-400 hover:bg-yellow-500 transition-all text-gray-900 font-bold text-2xl px-12 py-6 rounded-3xl shadow-xl shadow-yellow-300">
                Start Typing
            </button>
        </div>

        <!-- Typing Area -->
        <div id="gameContainer" class="hidden">
            <div class="typing-box p-10 text-display text-gray-700" id="textDisplay">
                <span id="completed" class="text-emerald-600"></span>
                <span id="current" class="font-semibold text-gray-900"></span>
                <span id="cursor" class="cursor"></span>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="hidden text-center mt-16">
            <h3 class="text-5xl font-bold mb-8 text-gray-900">Great Job!</h3>
            <div class="grid grid-cols-3 gap-10 max-w-lg mx-auto">
                <div>
                    <div id="finalWpm" class="text-6xl font-bold text-yellow-500">0</div>
                    <div class="text-gray-500">WPM</div>
                </div>
                <div>
                    <div id="finalAccuracy" class="text-6xl font-bold text-gray-800">100%</div>
                    <div class="text-gray-500">ACCURACY</div>
                </div>
                <div>
                    <div id="finalWords" class="text-6xl font-bold text-gray-800">0</div>
                    <div class="text-gray-500">WORDS</div>
                </div>
            </div>
            <button onclick="restartTest()" 
                    class="mt-12 bg-gray-900 hover:bg-black text-white px-10 py-5 rounded-3xl text-lg font-medium">
                Try Again
            </button>
        </div>
    </div>

    <script>
        // Web Audio API
        let audioContext;
        let soundEnabled = true;

        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, duration, type = 'sine', vol = 0.18) {
            if (!soundEnabled || !audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = vol;
            osc.connect(gain).connect(audioContext.destination);
            osc.start();
            setTimeout(() => osc.stop(), duration);
        }

        // Large Word Pool (A-Z variety)
        const wordPool = [
            "apple","banana","cat","dog","elephant","fast","great","happy","ice","jungle",
            "kite","lemon","mountain","never","ocean","purple","quick","river","sun","tree",
            "umbrella","victory","window","xylophone","yellow","zebra","amazing","beautiful",
            "creative","dynamic","energy","freedom","glorious","harmony","incredible","journey",
            "knowledge","liberty","magic","nature","optimistic","peace","quality","respect",
            "success","talent","unique","valuable","wisdom","excellent","fantastic","genius"
        ];

        let timeLeft = 60;
        let timerInterval;
        let isPlaying = false;
        let words = [];
        let currentIndex = 0;
        let userInput = "";
        let correctChars = 0;
        let totalChars = 0;
        let startTime;

        function generateText() {
            words = [];
            for (let i = 0; i < 40; i++) {
                words.push(wordPool[Math.floor(Math.random() * wordPool.length)]);
            }
        }

        function renderText() {
            const completed = document.getElementById("completed");
            const current = document.getElementById("current");

            completed.textContent = words.slice(0, currentIndex).join(" ") + " ";

            const target = words[currentIndex] || "";
            let html = "";

            for (let i = 0; i < target.length; i++) {
                if (i < userInput.length) {
                    html += userInput[i] === target[i] 
                        ? `<span class="text-emerald-600">${target[i]}</span>` 
                        : `<span class="text-red-500">${target[i]}</span>`;
                } else {
                    html += `<span class="text-gray-400">${target[i]}</span>`;
                }
            }
            current.innerHTML = html;
        }

        function updateStats() {
            const elapsed = (Date.now() - startTime) / 60000;
            const wpm = elapsed > 0 ? Math.floor((correctChars / 5) / elapsed) : 0;
            const accuracy = totalChars ? Math.round((correctChars / totalChars) * 100) : 100;

            document.getElementById("wpm").textContent = wpm;
            document.getElementById("cpm").textContent = Math.floor(correctChars / elapsed) || 0;
            document.getElementById("accuracy").textContent = accuracy + "%";
        }

        function processKey(e) {
            if (!isPlaying) return;

            if (e.key === " ") {
                e.preventDefault();
                if (userInput === words[currentIndex]) {
                    playSound(880, 35);
                    currentIndex++;
                    userInput = "";
                }
            } else if (e.key === "Backspace") {
                userInput = userInput.slice(0, -1);
            } else if (e.key.length === 1) {
                userInput += e.key.toLowerCase();
                totalChars++;
                const target = words[currentIndex];
                if (userInput[userInput.length-1] === target[userInput.length-1]) {
                    correctChars++;
                    playSound(760, 25);
                } else {
                    playSound(220, 70, 'sawtooth');
                }
            }
            renderText();
            updateStats();
        }

        function startGame() {
            initAudio();
            document.getElementById("startContainer").classList.add("hidden");
            document.getElementById("gameContainer").classList.remove("hidden");

            timeLeft = 60;
            currentIndex = 0;
            userInput = "";
            correctChars = 0;
            totalChars = 0;
            startTime = Date.now();

            document.getElementById("timerCircle").textContent = 60;
            document.getElementById("timerCircle").style.borderColor = "#eab308";

            generateText();
            renderText();
            isPlaying = true;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timerCircle").textContent = timeLeft;
                if (timeLeft <= 10) document.getElementById("timerCircle").style.borderColor = "#ef4444";
                if (timeLeft <= 0) endTest();
            }, 1000);

            window.addEventListener("keydown", processKey);
        }

        function endTest() {
            isPlaying = false;
            clearInterval(timerInterval);
            window.removeEventListener("keydown", processKey);

            const elapsed = (Date.now() - startTime) / 60000;
            const finalWpm = elapsed > 0 ? Math.floor((correctChars / 5) / elapsed) : 0;
            const accuracy = totalChars ? Math.round((correctChars / totalChars) * 100) : 100;

            document.getElementById("finalWpm").textContent = finalWpm;
            document.getElementById("finalAccuracy").textContent = accuracy + "%";
            document.getElementById("finalWords").textContent = currentIndex;

            document.getElementById("gameContainer").classList.add("hidden");
            document.getElementById("results").classList.remove("hidden");
        }

        function restartTest() {
            document.getElementById("results").classList.add("hidden");
            document.getElementById("startContainer").classList.remove("hidden");
            document.getElementById("gameContainer").classList.add("hidden");
        }

        window.onload = () => {
            document.getElementById("timerCircle").textContent = 60;
        };
    </script>
</body>
</html>
