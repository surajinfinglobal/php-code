<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Glassmorphism Login</title>
  <style>
    /* variables from original glass file */
    :root {
      --lg-bg-color: rgba(255, 255, 255, 0.25);
      --lg-highlight: rgba(255, 255, 255, 0.75);
      --lg-text: #ffffff;
      --lg-hover-glow: rgba(255, 255, 255, 0.4);
      --lg-red: #fb4268;
      --lg-emerald: #10b981;
      --lg-grey: #5b5b5b;
      --font-family: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      /* Background image from original file */
      background: url("https://images.unsplash.com/photo-1551384963-cccb0b7ed94b?q=80&w=3247&auto=format&fit=crop") center/cover;
      animation: bg-move 5s ease-in-out infinite alternate;
      overflow: hidden;
    }

    @keyframes bg-move {
      from { background-position: center center; }
      to { background-position: center top; }
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 420px;
      z-index: 10;
    }

    /* ========== GLASS CONTAINER CORE (From File 1) ========== */
    .glass-container {
      position: relative;
      display: flex;
      flex-direction: column;
      color: var(--lg-text);
      background: transparent;
      border-radius: 2.5rem;
      overflow: hidden;
      /* Original shadow and transition */
      box-shadow: 0 6px 6px rgba(0, 0, 0, 0.2), 0 0 20px rgba(0, 0, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
    }

    .glass-container:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
    }

    /* GLASS LAYERS (Wavy distortion effect) */
    .glass-filter {
      position: absolute;
      inset: 0;
      z-index: 0;
      backdrop-filter: blur(0px);
      filter: url(#lg-dist); /* Linking to SVG Filter */
      isolation: isolate;
    }

    .glass-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--lg-bg-color);
    }

    .glass-specular {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      overflow: hidden;
      box-shadow: inset 1px 1px 0 var(--lg-highlight),
                  inset 0 0 5px var(--lg-highlight);
    }

    .glass-content {
      position: relative;
      z-index: 3; /* Content must be above layers */
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ========== FORM ELEMENTS STYLING ========== */
    .login-header { text-align: center; margin-bottom: 0.5rem; }
    .login-header h2 { margin: 0; font-size: 2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
    .login-header p { opacity: 0.8; font-size: 0.9rem; margin-top: 5px; }

    .tabs-container {
      display: flex;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 5rem;
      padding: 0.3rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      padding: 0.6rem;
      cursor: pointer;
      border-radius: 5rem;
      font-weight: 600;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding-left: 5px; }

    .input-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 0.75rem;
    }

    .input-wrapper .glass-input {
      flex: 1;
      min-width: 0;
    }

    .input-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    .input-icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .glass-input {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.9rem 1.2rem;
      border-radius: 1rem;
      color: white;
      outline: none;
      transition: 0.3s;
    }

    .glass-input:focus {
      background: rgba(0, 0, 0, 0.25);
      border-color: var(--lg-highlight);
    }

    .glass-btn {
      background: white;
      color: black;
      border: none;
      padding: 1rem;
      border-radius: 5rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .glass-btn:hover {
      transform: translateY(-2px);
      background: var(--lg-highlight);
    }

    .login-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-top: 5px;
    }
    .login-footer a { color: white; text-decoration: none; opacity: 0.7; }
    .login-footer a:hover { opacity: 1; }

    /* Toast for feedback */
     .status-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translate(-50%, 100px);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      color: white;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .status-toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .toast-icon.success {
      background-color: var(--lg-emerald);
    }

    .toast-icon.error {
      background-color: var(--lg-red);
    }
    
      .hidden-form {
      display: none !important;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="glass-container">
      <!-- These 3 layers create the specific "File 1" effect -->
      <div class="glass-filter"></div>
      <div class="glass-overlay"></div>
      <div class="glass-specular"></div>
      
      <!-- Content -->
      <div class="glass-content">
        <div class="tabs-container">
         <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
          <button class="tab-btn" onclick="switchTab('register')">Sign Up</button>
        </div>
        
       
        <div class="login-header">
          <h2 id="form-title">Portal Access</h2>
          <p id="form-subtitle">Experience the liquid glass</p>
        </div>

        <form id="login-form" onsubmit="handleFormSubmit(event, 'login')" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="glass-input" placeholder="user@glass.io" required>
          </div>

          <div class="form-group" style="margin-top: 1rem;">
            <label>Password</label>
            <input type="password" class="glass-input" placeholder="••••••••" required>
          </div>

          <div class="login-footer">
            <label><input type="checkbox"> Remember me</label>
            <a href="#" onclick="triggerAction('forgot_pass')">Forgot?</a>
          </div>
 <button type="submit" class="glass-btn">
            <span>Sign In</span>
            
          </button>
          
        </form>

        <form id="register-form" class="hidden-form" onsubmit="handleFormSubmit(event, 'register')" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="reg-name" class="glass-input" placeholder="Jane Doe" required>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="reg-email" class="glass-input" placeholder="jane@example.com" required>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-pass">Create Password</label>
            <div class="input-wrapper">
              <input type="password" id="reg-pass" class="glass-input" placeholder="At least 6 characters" required minlength="6">
              <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('reg-pass', this)" title="Show Password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-footer">
            <label class="checkbox-label" style="font-size: 0.8rem;">
              <input type="checkbox" id="reg-terms" required> I agree to the Terms of Service
            </label>
          </div>

          <button type="submit" class="glass-btn">
            <span>Create Account</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- THE MAGIC FILTER (Copy-pasted from original file) -->
  <svg style="display: none">
    <filter id="lg-dist" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="70" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div  id="status-toast" class="status-toast"><div id="toast-icon-bg" class="toast-icon">
      <svg id="toast-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
    </div>
    <span id="toast-message">Action processed!</span></div>

  <script>

     function switchTab(mode) {
      const tabBtns = document.querySelectorAll('.tab-btn');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');

      tabBtns.forEach(btn => btn.classList.remove('active'));

      if (mode === 'login') {
        tabBtns[0].classList.add('active');
        loginForm.classList.remove('hidden-form');
        registerForm.classList.add('hidden-form');
        title.innerText = "Welcome Back";
        subtitle.innerText = "Please sign in to access your portal";
      } else {
        tabBtns[1].classList.add('active');
        loginForm.classList.add('hidden-form');
        registerForm.classList.remove('hidden-form');
        title.innerText = "Create Account";
        subtitle.innerText = "Sign up today for your glass workstation";
      }
    }

    // Toggle eye icon and show/hide characters
    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";

      if (isPassword) {
        // Eye open icon
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
          </svg>
        `;
        btn.title = "Hide Password";
      } else {
        // Eye closed icon
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        `;
        btn.title = "Show Password";
      }
    }
    
   function showToast(message, type = 'success') {
      const toast = document.getElementById('status-toast');
      const iconBg = document.getElementById('toast-icon-bg');
      const icon = document.getElementById('toast-icon');
      const msgSpan = document.getElementById('toast-message');

      msgSpan.innerText = message;
      
      if (type === 'success') {
        iconBg.className = 'toast-icon success';
        // Checkmark
        icon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
      } else {
        iconBg.className = 'toast-icon error';
        // Crossmark
        icon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
      }

      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 4000);
    }
       function triggerAction(action) {
      if (action === 'forgot_pass') {
        showToast("Password reset link has been dispatched!", "success");
      }
    }
  </script>
</body>
</html>
